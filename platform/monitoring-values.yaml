# Valores ajustados a un clúster k3s de un nodo en una VM
grafana:
  adminPassword: cambia-esta-clave
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
prometheus:
  prometheusSpec:
    # Recoge cualquier ServiceMonitor del clúster, no solo los de este chart
    serviceMonitorSelectorNilUsesHelmValues: false
    retention: 2d
    resources:
      requests: { cpu: 200m, memory: 512Mi }
alertmanager:
  enabled: false
# k3s integra estos componentes en un solo proceso: evitamos alertas falsas
kubeEtcd: { enabled: false }
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }
