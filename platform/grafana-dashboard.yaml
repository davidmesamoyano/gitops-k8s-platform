    \  },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"reqps\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"sum(rate(http_requests_total{namespace=\\\"demo\\\",status=~\\\"5..\\\"}[1m]))\",\n          \"legendFormat\": \"5xx\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          }\n        }\n      ]\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Memoria por pod\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 16\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"bytes\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"sum\
    \ by (pod) (container_memory_working_set_bytes{namespace=\\\"demo\\\",container=\\\"app\\\"})\",\n          \"legendFormat\": \"{{pod}}\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          }\n        }\n      ]\n    }\n  ]\n}"
