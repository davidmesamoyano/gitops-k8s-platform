    \    {\n      \"type\": \"timeseries\",\n      \"title\": \"Latencia p95\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 0\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"s\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"histogram_quantile(0.95, sum by (le, handler) (rate(http_request_duration_seconds_bucket{namespace=\\\"demo\\\"}[1m])))\",\n          \"legendFormat\": \"{{handler}}\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          }\n        }\n      ]\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Réplicas (HPA)\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n\
    \      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 8\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"kube_horizontalpodautoscaler_status_current_replicas{namespace=\\\"demo\\\"}\",\n          \"legendFormat\": \"actuales\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          }\n        },\n        {\n          \"refId\": \"B\",\n          \"expr\": \"kube_horizontalpodautoscaler_status_desired_replicas{namespace=\\\"demo\\\"}\",\n          \"legendFormat\": \"deseadas\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          }\n        }\n      ]\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"CPU por pod\",\n      \"datasource\"\
